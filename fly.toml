# One always-on machine with a volume for SQLite and nav data (spec section 12).
# Before the first deploy: fly apps create <name>; fly volumes create webfly_data --size 1 --region iad
app = "webfly"
primary_region = "iad"

[build]

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"

[[mounts]]
  source = "webfly_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
